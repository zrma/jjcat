name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS Apple Silicon prerelease
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: scripts/check-release-version.py

      - name: Run release gates
        run: scripts/check.sh

      - name: Build macOS app
        run: pnpm tauri build --bundles app

      - name: Package Apple Silicon artifacts
        run: scripts/package-macos-release.sh

      - name: Verify release artifacts
        run: scripts/verify-macos-release.sh

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: jjcat ${{ github.ref_name }}
          body_path: docs/releases/v0.9.0.md
          files: release-dist/*
          prerelease: true
          fail_on_unmatched_files: true
