name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS Apple Silicon prerelease
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Jujutsu
        env:
          JJCAT_JJ_VERSION: 0.43.0
          JJCAT_JJ_AARCH64_MACOS_SHA256: 84336bbe5673a36ccc6395c494021ba632794da078eb8c8c513a60f8e1cc3083
        run: |
          jj_archive="${RUNNER_TEMP}/jjcat-jj.tar.gz"
          jj_extract_dir="${RUNNER_TEMP}/jjcat-jj-${JJCAT_JJ_VERSION}"
          jj_bin_dir="${RUNNER_TEMP}/jjcat-bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/jj-vcs/jj/releases/download/v${JJCAT_JJ_VERSION}/jj-v${JJCAT_JJ_VERSION}-aarch64-apple-darwin.tar.gz" \
            -o "$jj_archive"
          printf '%s  %s\n' "$JJCAT_JJ_AARCH64_MACOS_SHA256" "$jj_archive" \
            | shasum -a 256 --check
          mkdir -p "$jj_extract_dir" "$jj_bin_dir"
          tar -xzf "$jj_archive" -C "$jj_extract_dir" ./jj
          install -m 0755 "$jj_extract_dir/jj" "$jj_bin_dir/jj"
          echo "$jj_bin_dir" >> "$GITHUB_PATH"
          "$jj_bin_dir/jj" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: scripts/check-release-version.py

      - name: Run release gates
        run: scripts/check.sh

      - name: Build macOS app
        run: pnpm tauri build --bundles app

      - name: Package Apple Silicon artifacts
        run: scripts/package-macos-release.sh

      - name: Verify release artifacts
        run: scripts/verify-macos-release.sh

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          name: jjcat ${{ github.ref_name }}
          body_path: docs/releases/v0.9.0.md
          files: release-dist/*
          prerelease: true
          fail_on_unmatched_files: true
