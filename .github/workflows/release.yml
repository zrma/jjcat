name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  macos:
    name: macOS Apple Silicon prerelease
    runs-on: macos-15
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Require beta updater credentials
        env:
          JJCAT_UPDATER_PUBLIC_KEY: ${{ vars.JJCAT_UPDATER_PUBLIC_KEY }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [[ -z "$JJCAT_UPDATER_PUBLIC_KEY" ]]; then
            printf 'Missing repository variable JJCAT_UPDATER_PUBLIC_KEY\n' >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY" ]]; then
            printf 'Missing repository secret TAURI_SIGNING_PRIVATE_KEY\n' >&2
            exit 1
          fi
          if [[ -z "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" ]]; then
            printf 'Missing repository secret TAURI_SIGNING_PRIVATE_KEY_PASSWORD\n' >&2
            exit 1
          fi

      - name: Configure signed beta updater
        env:
          JJCAT_UPDATER_PUBLIC_KEY: ${{ vars.JJCAT_UPDATER_PUBLIC_KEY }}
        run: |
          updater_config="${RUNNER_TEMP}/jjcat-updater.json"
          scripts/create-updater-config.py \
            --output "$updater_config" \
            --public-key-env JJCAT_UPDATER_PUBLIC_KEY
          printf 'JJCAT_UPDATER_CONFIG=%s\n' "$updater_config" >> "$GITHUB_ENV"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.24.0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Jujutsu
        env:
          JJCAT_JJ_VERSION: 0.43.0
          JJCAT_JJ_AARCH64_MACOS_SHA256: 84336bbe5673a36ccc6395c494021ba632794da078eb8c8c513a60f8e1cc3083
        run: |
          jj_archive="${RUNNER_TEMP}/jjcat-jj.tar.gz"
          jj_extract_dir="${RUNNER_TEMP}/jjcat-jj-${JJCAT_JJ_VERSION}"
          jj_bin_dir="${RUNNER_TEMP}/jjcat-bin"
          curl --proto '=https' --tlsv1.2 -fsSL \
            "https://github.com/jj-vcs/jj/releases/download/v${JJCAT_JJ_VERSION}/jj-v${JJCAT_JJ_VERSION}-aarch64-apple-darwin.tar.gz" \
            -o "$jj_archive"
          printf '%s  %s\n' "$JJCAT_JJ_AARCH64_MACOS_SHA256" "$jj_archive" \
            | shasum -a 256 --check
          mkdir -p "$jj_extract_dir" "$jj_bin_dir"
          tar -xzf "$jj_archive" -C "$jj_extract_dir" ./jj
          install -m 0755 "$jj_extract_dir/jj" "$jj_bin_dir/jj"
          echo "$jj_bin_dir" >> "$GITHUB_PATH"
          "$jj_bin_dir/jj" --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify release version
        run: scripts/check-release-version.py

      - name: Run release gates
        run: scripts/check.sh

      - name: Build macOS app
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: pnpm tauri build --bundles app --config "$JJCAT_UPDATER_CONFIG"

      - name: Package Apple Silicon artifacts
        run: scripts/package-macos-release.sh

      - name: Verify release artifacts
        env:
          JJCAT_UPDATER_PUBLIC_KEY: ${{ vars.JJCAT_UPDATER_PUBLIC_KEY }}
        run: scripts/verify-macos-release.sh

      - name: Publish GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          name: jjcat ${{ github.ref_name }}
          body_path: docs/releases/${{ github.ref_name }}.md
          files: release-dist/*
          prerelease: true
          fail_on_unmatched_files: true

      - name: Publish rolling beta updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view updater-beta >/dev/null 2>&1; then
            gh release upload \
              updater-beta \
              release-dist/latest-beta.json \
              --clobber
          else
            gh release create \
              updater-beta \
              release-dist/latest-beta.json \
              --target "$GITHUB_SHA" \
              --title "jjcat updater beta channel" \
              --notes "Rolling manifest for signed jjcat beta updates." \
              --prerelease
          fi
