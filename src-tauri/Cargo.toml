[package]
name = "jjcat"
version = "0.9.27"
description = "A local and remote repository manager for Jujutsu"
license = "Apache-2.0"
edition = "2024"
rust-version = "1.90"

[lib]
name = "jjcat_core"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2.6", features = [] }

[dependencies]
fs2 = "0.4.3"
glob = "0.3"
regex = "1.12"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tauri = { version = "2.12", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-process = "2.3.1"
# 업데이터의 기존 TLS와 아카이브 기능을 유지한다.
tauri-plugin-updater = { version = "2.14.1", default-features = false, features = ["rustls-tls", "zip"] }
tauri-plugin-window-state = "2.4.1"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "sync", "time"] }
tokio-util = "0.7"
tempfile = "3.23"
uuid = { version = "1.24", features = ["serde", "v4", "v5"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(not(target_os = "macos"))'.dependencies]
tauri-plugin-single-instance = "2"

[dev-dependencies]
base64 = "0.22"
minisign-verify = "0.2.5"
