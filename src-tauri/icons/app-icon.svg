<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#173d46"/>
      <stop offset="0.55" stop-color="#0c252d"/>
      <stop offset="1" stop-color="#06161c"/>
    </linearGradient>
    <radialGradient id="highlight" cx="0.33" cy="0.2" r="0.9">
      <stop offset="0" stop-color="#3a7078" stop-opacity="0.28"/>
      <stop offset="0.52" stop-color="#173b43" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#06161c" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-25%" y="-25%" width="150%" height="160%">
      <feDropShadow dx="0" dy="28" stdDeviation="32" flood-color="#000b10" flood-opacity="0.42"/>
    </filter>
    <clipPath id="tile">
      <rect x="72" y="72" width="880" height="880" rx="198"/>
    </clipPath>
  </defs>

  <g transform="translate(38.4 38.4) scale(0.925)">
    <rect x="72" y="72" width="880" height="880" rx="198" fill="#06161c" filter="url(#shadow)"/>
    <g clip-path="url(#tile)">
      <rect x="72" y="72" width="880" height="880" fill="url(#surface)"/>
      <rect x="72" y="72" width="880" height="880" fill="url(#highlight)"/>
      <image
        href="icon-source.png"
        x="10"
        y="10"
        width="1004"
        height="1004"
        preserveAspectRatio="xMidYMid meet"
        style="mix-blend-mode: screen"
      />
      <rect
        x="73.5"
        y="73.5"
        width="877"
        height="877"
        rx="196.5"
        fill="none"
        stroke="#a9e8e5"
        stroke-opacity="0.18"
        stroke-width="3"
      />
    </g>
  </g>
</svg>
